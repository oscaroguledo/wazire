services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: wazire-postgres
    env_file:
      - ./backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wazire} -d ${POSTGRES_DB:-wazire}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wazire-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    pgbouncer:
      image: edoburu/pgbouncer:1.17.0
      restart: unless-stopped
      container_name: wazire-pgbouncer
      env_file:
        - ./backend/.env
      ports:
        - "${PGBOUNCER_PORT:-6432}:6432"
      volumes:
        - ./backend/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
        - ./backend/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      depends_on:
        postgres:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -h postgres -p ${POSTGRES_PORT:-5432} -U ${POSTGRES_USER:-wazire} -d ${POSTGRES_DB:-wazire}"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
        - wazire-network
      deploy:
        resources:
          limits:
            cpus: '1.0'
            memory: 256M
          reservations:
            cpus: '0.25'
            memory: 64M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: wazire-redis
    env_file:
      - ./backend/.env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "${REDIS_PASSWORD}" ]; then redis-cli -a "${REDIS_PASSWORD}" ping || exit 1; else redis-cli ping || exit 1; fi']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wazire-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  kafka:
    image: bitnami/kafka:4
    restart: unless-stopped
    container_name: wazire-kafka
    env_file:
      - ./backend/.env
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_MODE=kraft
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wazire-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wazire-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wazire-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: wazire-celery-worker
    env_file:
      - ./backend/.env
    command: celery -A celery_app.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wazire-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: wazire-celery-beat
    env_file:
      - ./backend/.env
    command: celery -A celery_app.celery_app beat --loglevel=info
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wazire-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wazire-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - wazire-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  wazire-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
