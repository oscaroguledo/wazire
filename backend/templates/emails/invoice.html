<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Invoice</title>
    <style>
      body { margin:0; padding:0; background:#f8fafc; font-family: Inter, Arial, sans-serif; }
      .wrap { width:100%; max-width:720px; margin:0 auto; }
      .invoice { background:#ffffff; border-radius:0.5rem; overflow:hidden; border:1px solid #e6eef8; }
      .inv-header { padding:1.25rem; background: linear-gradient(90deg,#33475B,#425b76); color:#fff; }
      .inv-body { padding:1rem; color:#0f172a; }
      .inv-footer { padding:1rem; color:#64748b; font-size:13px; text-align:center; }
      .invoice-snippet { margin-top:0.625rem; border:1px dashed #e6eef8; padding:0.75rem; border-radius:0.375rem; }
      @media (max-width:480px) { .inv-header { padding:1rem } .inv-body { padding:0.875rem } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="invoice">
        <div class="inv-header">
          <h2 style="margin:0;font-size:1.125rem">Invoice #{invoice_number}</h2>
        </div>
        <div class="inv-body">
          <p>Dear customer,</p>
          <p>Thank you for your payment. Below is a summary of your invoice.</p>
          <div class="invoice-snippet">{invoice_html}</div>
          <p style="margin-top:1.125rem">If you have questions, reply to this email or contact support.</p>
        </div>
        <div class="inv-footer">© {year} Wazire</div>
      </div>
    </div>
  </body>
</html>
