<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your email</title>
    <style>
      /* Mobile-first responsive email styles matching frontend tokens */
      body { margin:0; padding:0; background:#f8fafc; font-family: Inter, Arial, sans-serif; }
      .container { width:100%; max-width:600px; margin:0 auto; background:#ffffff; border-radius:0.5rem; overflow:hidden; }
      .header { padding:1.5rem; background: #425b76; color:#ffffff; text-align:center; }
      .content { padding:1rem; color:#0f172a; }
      .button { display:inline-block; padding:0.75rem 1.25rem; background:#617b95; color:#ffffff; border-radius:0.375rem; text-decoration:none; }
      .footer { padding:1rem; font-size:13px; color:#64748b; text-align:center; }
      @media (max-width:420px) { .header { padding:1.125rem; } .content { padding:0.875rem; } }
    </style>
  </head>
  <body>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <div class="container">
            <div class="header">
              <h1 style="margin:0;font-size:1.25rem;line-height:1.2">Welcome to Wazire</h1>
            </div>
            <div class="content">
              <p>Hi {full_name},</p>
              <p>Thanks for signing up. Please verify your email address by clicking the button below.</p>
              <p style="text-align:center;margin:1.5rem 0"><a class="button" href="{verify_url}">Verify email</a></p>
              <p>If the button doesn't work, copy and paste this link into your browser:</p>
              <p style="word-break:break-all;color:#334155">{verify_url}</p>
            </div>
            <div class="footer">© {year} Wazire — <span style="color:#425b76;">support@wazire.app</span></div>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
