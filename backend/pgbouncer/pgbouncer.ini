[databases]
# Route the wazire DB through the postgres container
wazire = host=postgres port=5432 dbname=${POSTGRES_DB:-wazire} user=${POSTGRES_USER:-wazire} password=${POSTGRES_PASSWORD:-wazire}

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 100
default_pool_size = 20
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Timeouts (seconds)
server_lifetime = 3600
server_idle_timeout = 600
*** End Patch