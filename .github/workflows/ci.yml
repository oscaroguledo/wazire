name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Backend: lint, type-check, test with coverage
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint · type-check · test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wazire_test
          POSTGRES_USER: wazire
          POSTGRES_PASSWORD: wazire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wazire"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy . --ignore-missing-imports --exclude '(alembic|\.venv|venv)'

      - name: Test with coverage (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://wazire:wazire@localhost:5432/wazire_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENV: test
          DEBUG: "false"
          KAFKA_BOOTSTRAP_SERVERS: ""
          GROQ_API_KEY_1: ""
          GROQ_API_KEY_2: ""
          GROQ_API_KEY_3: ""
          GROQ_API_KEY_4: ""
          PAYSTACK_SECRET_KEY: ""
          MONNIFY_API_KEY: ""
          MONNIFY_SECRET_KEY: ""
          FRONTEND_ORIGIN: "http://localhost:5173"
          LOG_LEVEL: "WARNING"
        run: |
          pytest \
            --cov=. \
            --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=90

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Frontend: lint, type-check, test with coverage
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · type-check · test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check (tsc)
        run: npx tsc --noEmit

      - name: Test with coverage (vitest)
        run: npm run test:coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Playwright: end-to-end tests (runs after backend + frontend pass)
  # ─────────────────────────────────────────────────────────────────────────────
  playwright:
    name: Playwright (e2e)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Start backend (background)
        run: |
          pip install -r requirements.txt
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://wazire:wazire@localhost:5432/wazire_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key
          ENV: test
          DEBUG: "false"
          KAFKA_BOOTSTRAP_SERVERS: ""
          FRONTEND_ORIGIN: "http://localhost:5173"
          LOG_LEVEL: "WARNING"

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8000
